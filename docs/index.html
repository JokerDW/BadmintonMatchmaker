    <title>羽球排場</title>
    <script>
      // 在畫面出來前先套用主題，避免亮暗閃一下（邏輯同 src/lib/theme.ts）
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('badminton-theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1c1b1a' : '#f3f2f2');
      })();
    </script>
